# ============================================================
# LLM-Test 配置文件
# 模型名称: Qwen3-VL-30B-A3B-Instruct-FP8
# 目标平台: NVIDIA Jetson Thor (ARM64, Ubuntu) / Desktop GPU
# 作者: LLM-Test Team
# ============================================================

[model]
# 模型权重路径（本地路径或 HuggingFace 模型ID）
model_path = /home/zk/Project/LLM-weight/Qwen3-VL-30B-A3B-Instruct-FP8/
# 模型名称（用于日志和前端显示）
model_name = Qwen3-VL-30B-A3B-Instruct-FP8
# 张量并行数（根据GPU数量调整，Thor单卡设为1）
tensor_parallel_size = 1
# 上下文长度（模型固有的最大上下文长度，通常对应max_position_embeddings，可被SGLang扩展）
# Qwen3-VL-30B-A3B-Instruct模型支持最大262,144，但SGLang可扩展至1048576
max_context_length = 1048576
# 模型类型: text | vision
# 当设置为 vision 时，前端将启用视觉聊天模式（图片上传/摄像头拍照）
model_type = vision
# ========== VLA 专用配置 (当 model_type=vision 时生效) ==========
# 最大图片大小 (字节, 默认 10MB)
max_image_size = 10485760
# 支持的图片格式 (逗号分隔)
supported_formats = png,jpg,jpeg,gif,webp
# 最大图片 token 数
max_image_tokens = 8192
# ========== 图片预处理（降低 TTFT）==========
# 文件上传图片最大边长（像素）：上传图片在后端预处理时缩放到此尺寸以内
#   原理：Qwen3-VL visual encoder 的 token 数 ∝ 像素数，2560x1600 ≈ 4M 像素 → ~8000 token → TTFT ~100s
#         缩放到 1280 max → ~1M 像素 → ~2000 token → TTFT ~25s（约 4x 加速）
#   设为 0 / 留空 = 不缩放（保持原始分辨率，供需要最高精度的场景使用）
#   作用链路: config.ini → backend ModelConfig → /config 端点 vision.max_image_dimension
#             → 后端 process_image_binary 实际缩放（ImageUploader 上传路径）
max_image_dimension = 1280
# 摄像头拍照图片的前端 canvas 预缩最大边长（像素）
#   摄像头路径在前端 canvas 阶段即完成缩放，后端不会二次触发缩放（因低于 max_image_dimension）
#   适当降低此值可进一步减少拍照场景的 TTFT，但会损失细节
#   设为 0 / 留空 = 不缩放（保持摄像头原始分辨率）
#   作用链路: config.ini → backend ModelConfig → /config 端点 vision.camera_max_dimension
#             → 前端 CameraCapture.tsx canvas 预缩（CameraCapture 拍照路径）
camera_max_dimension = 1024

[inference]
# 采样温度（0.0-2.0，越高越随机）
temperature = 0.7
# Top-P 核采样（0.0-1.0）
top_p = 0.92
# Top-K 采样（0表示禁用）
top_k = 50
# 最大生成token数
max_tokens = 262144
# 重复惩罚因子（1.0表示无惩罚）
repetition_penalty = 1.1
# 是否启用流式输出
stream = true
# 请求超时时间（秒，默认90分钟）
timeout = 5400
[kv_cache]
# 注意：以下参数在当前 SGLang 版本中不支持，无法传递给 launch_server。
# enable_block_reuse 和 max_cache_size_mb 已废弃。
# 如果未来版本支持，可取消注释并调整脚本。
# 是否启用KV Cache块复用（NVFP4模型建议关闭）- 废弃
# enable_block_reuse = false
# KV Cache最大容量（MB，0表示自动）- 废弃
# max_cache_size_mb = 20480  # 限制为 20GB（根据您的总内存 96GB 调整，留出足够空间给模型和推理）

# ============================================================
# SGLang 后端配置
# ============================================================

[sglang]
# SGLang 服务主机地址
host = 127.0.0.1
# SGLang 服务端口
port = 30000
# 推理解析器：qwen3-thinking / gpt-oss
reasoning_parser =
# 聊天模板（针对非推理模型）：
chat_template =
# 工具调用解析器：qwen / gpt-oss/ qwen3_coder
tool_call_parser = qwen3_coder
# 是否禁用 CUDA 图优化
disable_cuda_graph = false
# 张量并行大小(Thor单卡设为1)
tensor_parallel_size = 1
# 上下文长度（传递给SGLang服务器的--context-length参数，可覆盖模型默认值）
# Qwen3-Coder-30B-A3B-Instruct模型支持最大262,144, 但SGLang可扩展至1048576
max_context_length = 1048576
# 内存使用比例（限制SGLang使用的GPU内存比例，0.0-1.0，默认0.893）
mem_fraction_static = 0.80
# EAGLE speculative decoding 配置（如果需要开启）
speculative_algorithm =
speculative_draft_model_path =
# 是否信任远程代码
trust_remote_code = true
# 注意力后端：triton /trtllm_mha / torch_native / flashinfer（最快，v0.5.9已支持Thor）/FA4（仅在prefill阶段支持，不推荐在Thor上使用） 等
# ⚠️ Qwen3.5 是 hybrid GDN 模型（混合 Attention + Mamba/SSM），Blackwell GPU 上
#    hybrid 模型只支持 triton 或 trtllm_mha，flashinfer 会报 AssertionError。
#    纯 Attention 模型（如 Qwen3）才可以使用 flashinfer。
attention_backend = flashinfer
# 多模态视觉编码器（ViT）注意力后端：triton_attn / fa3
# ⚠️ 当 SGLANG_VIT_ENABLE_CUDA_GRAPH=1 时，InternViTCudaGraphRunner 强制要求
#    mm_attention_backend 必须显式设为 triton_attn 或 fa3，否则抛出
#    RuntimeError: Not supported ViT attention backend for InternVL CG
# Jetson Thor (SM110 Blackwell) 上 FA3 不支持 (FA3=FlashAttention3，需 SM90+)
# 因此必须使用 triton_attn
mm_attention_backend = triton_attn
# MoE 运行器后端：auto / triton / cutlass / flashinfer_cutlass 等
# （1）对于FP4：Blackwell/Thor(SM 110)，sgl_kernel 的 CUTLASS FP4 内核不支持 SM 110，
#     必须使用 flashinfer_cutlass（JIT 编译，内部将 SM 110 映射到 SM 100 模块）
# （2）对于FP8：cutlass FP8 MoE 内部断言 is_sm90_supported() or is_sm100_supported()，
#     而SM 110 不满足该断言（SGLang 的检测函数未覆盖 SM110），会直接 AssertionError 崩溃。
#     FP8模型请使用 triton（无 SM 版本限制），性能不如 cutlass 但兼容所有架构。
# （4）gptq_marlin 量化要求 moe_runner_backend 必须为 auto（内部断言），不能设为 triton
moe_runner_backend = triton
# 量化格式：
#（1）对于 flashinfer_cutlass moe，必须明确指定 modelopt_fp4/ modelopt_nvfp8 /or bfloat16 (None)
#（2）gptq MoE 模型必须使用 gptq_marlin，普通 gptq 不支持 MoE（会报 TypeError）
quantization = fp8
# FP8 GEMM 后端：triton / cutlass
# cutlass 的 fp8_blockwise_scaled_mm 内核不支持 SM110（NotImplementedError），
# 必须改用 triton（兼容所有架构，性能略低）。
fp8_gemm_backend = triton
# ========== Visual Encoder FP16 量化（降低 TTFT）==========
# 模型计算数据类型：float16 | bfloat16 | float32 | auto
# 对于 VLM：将 dtype 设为 float16 可使 visual encoder prefill 阶段更快
#   - float16: 速度最快（Jetson Thor Blackwell FP16 吞吐最高），TTFT 可降低 20-40%
#   - bfloat16: 数值稳定性更好，但速度略慢于 float16
#   - auto: 由模型配置决定（Qwen3-VL FP8 通常默认 bfloat16）
# 注意：仅影响 activations/计算精度，FP8 权重会自动 dequant 到此精度
# 千问3.5 FP8的Mamba hybrid架构只支持bfloat16，无法使用float16
dtype =
# ========== Visual Token 预算控制（降低 TTFT 的最关键参数）==========
# 视觉编码器处理的最大像素数
#   Qwen3-VL 默认 1003520 (≈1280×784)，降低此值可直接减少 visual token 数
#   计算公式: visual_tokens ≈ pixels / (patch_size^2) = pixels / 784
#   示例: 1003520 → ~1280 token, 501760 → ~640 token, 250880 → ~320 token
#   建议: Jetson Thor 上设为 589824（平衡质量和速度）
image_max_pixels =
# 视觉编码器处理的最小像素数（太小会丢失关键细节）,可设100352
image_min_pixels = 
# Prefill chunk size（预填充块大小，用于优化预填充阶段的内存使用）
prefill_chunk_size =

[server]
# API服务主机地址
host = 0.0.0.0
# API服务端口
port = 8000
# 工作进程数（Thor上建议设为1）
workers = 1
# API密钥（留空表示不启用认证）
api_key = 
# 跨域允许的源（*表示允许所有）
cors_origins = *

[frontend]
# 前端开发服务器端口
dev_port = 3000
# 后端API地址（前端调用）
api_base_url = http://localhost:8000


# ============================================================
# vLLM 后端配置
# ============================================================

[vllm]
# vLLM 服务主机地址
host = 127.0.0.1
# vLLM 服务端口
port = 30000
# 张量并行大小（多GPU时使用, Thor必须用1）
tensor_parallel_size = 1
# 流水线并行大小（多GPU时使用）
pipeline_parallel_size = 1
# 分布式执行后端：ray / mp (multiprocessing)
distributed_executor_backend =
# 模型最大上下文长度
max_model_len = 162144
# GPU内存利用率（0.0-1.0）
gpu_memory_utilization = 0.60
# 数据类型：auto / half / float16 / bfloat16 / float32
dtype = bfloat16
# 量化方法：awq / gptq / fp8 / bitsandbytes / modelopt / 留空表示不量化
quantization = fp8
# 自定义tokenizer路径（留空使用模型自带）
tokenizer =
# 模型版本/分支（留空使用默认）
revision =
# tokenizer版本（留空使用默认）
tokenizer_revision =
# 模型加载格式：auto / safetensors / pt / npcache / dummy
load_format = auto
# 模型下载目录（留空使用默认缓存）
download_dir =
# 是否信任远程代码
trust_remote_code = true
# 是否强制使用eager模式（禁用CUDA图）
# vLLM 0.17.1 默认 False（启用 CUDA Graph，混合 eager+graph 最高性能）
# 对 VLM+摄像头场景：保持 False，vLLM 会通过多档 CUDA Graph capture 处理可变图像 token 长度
# 仅在遇到 CUDA Graph 崩溃/OOM 时才设为 true（纯 eager 模式解码速度显著更慢）
enforce_eager =
# 最大并发序列数
max_num_seqs = 1
# 最大批处理token数（0表示自动）:如果说 max_model_len 是杯子的容量，那么 max_num_batched_tokens 就是水龙头的流量
# ⚠️ Mamba hybrid 模型（如 Qwen3.5-35B-A3B）在 Mamba cache align 模式下，
#    block_size 会被自动对齐为 2096（与 Mamba d_state 有关），
#    必须满足 block_size <= max_num_batched_tokens，否则 VllmConfig 校验失败。
#    因此此值必须 >= 2096，设为 4096（下一个 2 的幂次）以兼容并留有余量。
max_num_batched_tokens = 4096
# KV Cache块大小：16 / 32 / 64 / 128
block_size =
# 是否启用前缀缓存
# vLLM 0.17.1 默认 True（APC 自动前缀缓存已内置开启）
# 对 VLM：摄像头每张照片图像 token 唯一，图像缓存命中率低；
# 但固定系统提示词可被缓存，多轮对话 TTFT 明显下降；FP8 下工作正常
enable_prefix_caching = true
# KV Cache数据类型：auto / fp8 / fp8_e5m2 / fp8_e4m3
kv_cache_dtype =
# CPU swap空间大小（GB）
swap_space =
# CPU卸载内存大小（GB，0表示禁用）
cpu_offload_gb =
# 注意力后端：首选TRITON_ATTN，其次FLASH_ATTN / FLASHINFER / XFORMERS / ROCM_FLASH / TORCH_SDPA（vllm仅视觉模型）
attention_backend = FLASH_ATTN
# Flash Attention 版本（仅在 attention_backend=FLASH_ATTN 时生效）
# vLLM 0.17.1 新增参数，通过 --attention-config '{"flash_attn_version": N}' 传递
# 可选值：2 / 3 / 4（留空 = 自动选最优版本）
# 前提：flash-attn 包须 >= 4.x，GPU 须为 Ampere(SM80+)/Hopper(SM90)/Blackwell(SM110)
flash_attn_version =
# 是否禁用FlashAttention
disable_flash_attn =
# 是否启用分块预填充
enable_chunked_prefill = true
# 最大序列长度用于捕获CUDA图（0表示自动）
max_seq_len_to_capture =
# 是否禁用滑动窗口
disable_sliding_window = false
# 是否禁用统计日志
disable_log_stats = false
# 是否禁用请求日志
disable_log_requests = false
# 最大logprobs数量
max_logprobs =
# 是否启用prompt logprobs
enable_prompt_logprobs = false
# 是否禁用自定义all-reduce
disable_custom_all_reduce = false

