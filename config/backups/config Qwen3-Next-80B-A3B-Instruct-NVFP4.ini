# ============================================================
# LLM-Test 配置文件
# 模型名称: Qwen3-Next-80B-A3B-Instruct-NVFP4
# 目标平台: NVIDIA Jetson Thor (ARM64, Ubuntu) / Desktop GPU
# 作者: LLM-Test Team
# ============================================================

[model]
# 模型权重路径（本地路径或 HuggingFace 模型ID）
model_path = /home/zk/Project/LLM-weight/Qwen3-Next-80B-A3B-Instruct-NVFP4/
# 模型名称（用于日志和前端显示）
model_name = Qwen3-Next-80B-A3B-Instruct-NVFP4
# 张量并行数（根据GPU数量调整，Thor单卡设为1）
tensor_parallel_size = 1
# 上下文长度（模型固有的最大上下文长度，通常对应max_position_embeddings，可被SGLang扩展）

max_context_length = 262144

[inference]
# 采样温度（0.0-2.0，越高越随机）
temperature = 0.7
# Top-P 核采样（0.0-1.0）
top_p = 0.9
# Top-K 采样（0表示禁用）
top_k = 50
# 最大生成token数
max_tokens = 131072
# 重复惩罚因子（1.0表示无惩罚）
repetition_penalty = 1.1
# 是否启用流式输出
stream = true
# 请求超时时间（秒，默认90分钟）
timeout = 5400
[kv_cache]
# 注意：以下参数在当前 SGLang 版本中不支持，无法传递给 launch_server。
# enable_block_reuse 和 max_cache_size_mb 已废弃。
# 如果未来版本支持，可取消注释并调整脚本。
# 是否启用KV Cache块复用（NVFP4模型建议关闭）- 废弃
# enable_block_reuse = false
# KV Cache最大容量（MB，0表示自动）- 废弃
# max_cache_size_mb = 20480  # 限制为 20GB（根据您的总内存 96GB 调整，留出足够空间给模型和推理）
# 限制总 token 缓存规模（控制 KV Cache 总量）
# 限制并发请求数（降低瞬时峰值）
# 限制单次预填充 token 上限
# 预填充分块大小（降低一次性峰值内存）
# Mamba 缓存内存比例（降低 Mamba Cache 占用）
# Mamba 状态精度（降低内存占用）

# ============================================================
# SGLang 后端配置
# ============================================================

[sglang]
# SGLang 服务主机地址
host = 127.0.0.1
# SGLang 服务端口
port = 30000
# 推理解析器：qwen3-thinking / gpt-oss
reasoning_parser =
# 聊天模板（针对非推理模型）：
chat_template =
# 工具调用解析器：qwen25 / gpt-oss
tool_call_parser =
# 是否禁用 CUDA 图优化
disable_cuda_graph = true
# FP8 GEMM 后端：triton / cutlass
fp8_gemm_backend =
# 张量并行大小
tensor_parallel_size = 1
# 上下文长度（传递给SGLang服务器的--context-length参数，可覆盖模型默认值）
# Qwen3-Coder-30B-A3B-Instruct模型支持最大262,144, 但SGLang可扩展至1048576
max_context_length = 100000
# 内存使用比例（限制SGLang使用的GPU内存比例，0.0-1.0，默认0.893）
mem_fraction_static = 0.85
# 限制总 token 缓存规模（控制 KV Cache 总量）
max_total_tokens = 100000
# 限制并发请求数（降低瞬时峰值）
max_running_requests = 1
# 限制单次预填充 token 上限（UMA 上需要大幅降低以控制峰值激活内存）
max_prefill_tokens =
# 预填充分块大小（长输入按此大小分块处理，降低一次性峰值内存）
chunked_prefill_size = 1024
# Mamba 缓存内存比例（降低 Mamba Cache 占用）
mamba_full_memory_ratio =
# Mamba 状态精度（降低内存占用）
mamba_ssm_dtype =
# Mamba 缓存条目数（auto-calc 在 UMA 上会算成 109 条，远超需要，显式限制）
max_mamba_cache_size = 4
# 跳过 server warmup（避免启动时的 prefill 触发 JIT 编译峰值内存）
# 建议首次启动时设 false 让 warmup 预编译内核，后续可改 true
skip_server_warmup = false
# EAGLE speculative decoding 配置（如果需要开启）
# speculative_algorithm =
# speculative_draft_model_path =
# 是否信任远程代码
trust_remote_code = true
# 量化方式：modelopt_fp4 / fp8 / awq 等
quantization = modelopt_fp4
# MoE 后端：auto / flashinfer_cutlass / flashinfer_trtllm / triton_kernel 等
moe_runner_backend = triton
# 注意力后端：triton / torch_native / flashinfer （最快） 等
# 对于不支持 flashinfer 的 GPU（如 SM80 及以下），使用 triton；目前flashinfer还不支持SM110
attention_backend = triton

[server]
# API服务主机地址
host = 0.0.0.0
# API服务端口
port = 8000
# 工作进程数（Thor上建议设为1）
workers = 1
# API密钥（留空表示不启用认证）
api_key = 
# 跨域允许的源（*表示允许所有）
cors_origins = *

[frontend]
# 前端开发服务器端口
dev_port = 3000
# 后端API地址（前端调用）
api_base_url = http://localhost:8000


[container]
# 是否启用容器模式（启用后将通过HTTP调用容器API而非本地加载模型）
enabled = false
# OpenAI 兼容 API 地址（必须以 /v1 结尾）
# 例如 vLLM: http://localhost:8001/v1
api_url = http://localhost:8080/v1
# 模型名称（留空则使用 [model] 中的 model_name）
model_name = 
# 请求超时时间（秒，大模型推理可能需要较长时间）
timeout = 300
# 连接失败最大重试次数
max_retries = 3

# ============================================================
# Debug 调试开关
# 启用后会在终端输出对应模块的详细调试信息
# ============================================================

[debug]
# 总开关：关闭后忽略所有debug子开关
enabled = true

# 模型加载调试：显示模型加载进度、内存占用、设备信息
debug_model_loading = true

# 推理过程调试：显示推理耗时、token统计、生成速度
debug_inference = true

# API请求调试：显示请求/响应详情、参数校验
debug_api = true

# 内存监控调试：显示显存/内存占用变化
debug_memory = false

# 配置加载调试：显示配置文件解析过程
debug_config = true

# 前端调试：启用前端详细日志
debug_frontend = true

# ============================================================
# 平台特定配置
# 针对不同部署平台的特殊设置
# ============================================================

[platform]
# 当前平台标识: desktop / jetson_thor
current = desktop

[platform.jetson_thor]
# Jetson Thor 专用配置
# 启用 DLA 加速（如果可用）
use_dla = false
# 功耗模式: MAXN / 15W / 30W
power_mode = MAXN
# 启用内存优化模式
memory_optimize = true

[platform.desktop]
# 桌面GPU专用配置
# 是否使用多GPU
multi_gpu = false
# GPU设备ID列表（逗号分隔）
gpu_devices = 0


[logging]
# 日志级别: DEBUG / INFO / WARNING / ERROR / CRITICAL
level = INFO
# 日志文件路径（留空表示仅输出到控制台）
file_path = 
# 日志格式
format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s
# 是否启用彩色输出
colorize = true
