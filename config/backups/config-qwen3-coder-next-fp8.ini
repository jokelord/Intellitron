# ============================================================
# LLM-Test 配置文件
# 模型名称: Qwen3-Coder-Next-FP8
# 目标平台: NVIDIA Jetson Thor (ARM64, Ubuntu) / Desktop GPU
# 作者: LLM-Test Team
# ============================================================

[model]
# 模型权重路径（本地路径或 HuggingFace 模型ID）
model_path = /home/zk/Project/LLM-weight/Qwen3-Coder-Next-FP8/
# 模型名称（用于日志和前端显示）
model_name = Qwen3-Coder-Next-FP8
# 张量并行数（根据GPU数量调整，Thor单卡设为1）
tensor_parallel_size = 1
# 上下文长度（模型固有的最大上下文长度，通常对应max_position_embeddings，可被SGLang扩展）
max_context_length = 262144

[inference]
# 采样温度（0.0-2.0，越高越随机）
temperature = 0.7
# Top-P 核采样（0.0-1.0）
top_p = 0.9
# Top-K 采样（0表示禁用）
top_k = 50
# 最大生成token数
max_tokens = 131072
# 重复惩罚因子（1.0表示无惩罚）
repetition_penalty = 1.1
# 是否启用流式输出
stream = true
# 请求超时时间（秒，默认90分钟）
timeout = 5400
[kv_cache]
# 注意：以下参数在当前 SGLang 版本中不支持，无法传递给 launch_server。
# enable_block_reuse 和 max_cache_size_mb 已废弃。
# 如果未来版本支持，可取消注释并调整脚本。
# 是否启用KV Cache块复用（NVFP4模型建议关闭）- 废弃
# enable_block_reuse = false
# KV Cache最大容量（MB，0表示自动）- 废弃
# max_cache_size_mb = 20480  # 限制为 20GB（根据您的总内存 96GB 调整，留出足够空间给模型和推理）

# ============================================================
# SGLang 后端配置
# ============================================================

[sglang]
# SGLang 服务主机地址
host = 127.0.0.1
# SGLang 服务端口
port = 30000
# 推理解析器：qwen3-thinking / gpt-oss
reasoning_parser =
# 聊天模板（针对非推理模型）：
chat_template =
# 工具调用解析器：qwen25 / gpt-oss/ qwen3_coder
tool_call_parser = qwen3_coder
# 是否禁用 CUDA 图优化
disable_cuda_graph = true
# FP8 GEMM 后端：triton / cutlass(最快但目前sm110用不了)
fp8_gemm_backend = triton
# 张量并行大小(--tp-size)
tensor_parallel_size = 1
# 上下文长度（传递给SGLang服务器的--context-length参数，可覆盖模型默认值）
# Qwen3-Coder-30B-A3B-Instruct模型支持最大262,144, 但SGLang可扩展至1048576
max_context_length = 270000
# 内存使用比例（限制SGLang使用的GPU内存比例，0.0-1.0，默认0.893）
mem_fraction_static = 0.8
# EAGLE speculative decoding 配置（如果需要开启）
# speculative_algorithm =
# speculative_draft_model_path =
# 是否信任远程代码
trust_remote_code = true
# 注意力后端：triton / torch_native / flashinfer （最快） 等
# 对于不支持 flashinfer 的 GPU（如 SM80 及以下），使用 triton；目前flashinfer还不支持SM110
attention_backend = triton
# MoE 运行器后端：auto / triton / cutlass / flashinfer_cutlass 等
# 对于 Blackwell/Thor GPU (SM 110)，sgl_kernel 的 CUTLASS FP4 内核不支持 SM 110，
# 必须使用 flashinfer_cutlass（JIT 编译，内部将 SM 110 映射到 SM 100 模块）
moe_runner_backend = triton
# 量化格式：对于 flashinfer_cutlass，必须明确指定 modelopt_fp4/ modelopt_nvfp8
quantization =

# ============================================================
# vLLM 后端配置
# ============================================================

[vllm]
# vLLM 服务主机地址
host = 127.0.0.1
# vLLM 服务端口
port = 30000
# 张量并行大小
tensor_parallel_size = 1
# 上下文长度（传递给 vLLM 的 --max-model-len 参数）
max_model_len = 131072
# GPU 显存利用率（0.0-1.0，NVFP4 模型 README 推荐 0.85）
gpu_memory_utilization = 0.61
# 数据类型：auto / float16 / bfloat16 / float32
# NVFP4 混合精度模型使用 auto 即可（内部自动处理 FP4 experts + BF16 attention）
dtype =
# 量化方法：留空表示不指定（NVFP4 量化已烧录在权重中，vLLM 自动识别，无需手动指定）
# 注意: 不要填 fp4 / nvfp4 等值，模型自带量化配置
quantization =
# 是否信任远程代码
trust_remote_code = true
# 是否使用 eager 模式（禁用 CUDA graph）
# Jetson Thor (Blackwell sm_110) 建议开启，避免 CUDA graph 在 UMA 架构上的兼容性问题
enforce_eager = true
# 最大并发序列数（类似 SGLang 的 max_running_requests，0 表示默认）
max_num_seqs =1
# 是否启用前缀缓存（prefix caching）
enable_prefix_caching =
# 推理解析器（用于推理模型，如 deepseek_r1）：留空表示不启用
reasoning_parser =
# 是否启用推理模式（enable-reasoning）
enable_reasoning = false
# 聊天模板（可选，留空使用模型默认）
chat_template =
# 工具调用解析器：留空表示不启用，可选 hermes / qwen25 等
tool_call_parser =
# 是否启用自动工具选择
enable_auto_tool_choice =
# 自定义服务模型名称（留空则使用模型路径作为名称）
served_model_name = Qwen3-Coder-30B-A3B-Instruct-FP8
# KV cache 数据类型：auto / fp8 / fp8_e5m2 / fp8_e4m3
kv_cache_dtype =
# 交换空间大小（GiB，CPU 端 KV cache 交换空间）
swap_space =
# 是否禁用自定义 all-reduce（多GPU时）
disable_custom_all_reduce =
# 推测解码配置（留空表示禁用，避免在 Jetson Thor 上卡住）
# speculative_config =

[server]
# API服务主机地址
host = 0.0.0.0
# API服务端口
port = 8000
# 工作进程数（Thor上建议设为1）
workers = 1
# API密钥（留空表示不启用认证）
api_key = 
# 跨域允许的源（*表示允许所有）
cors_origins = *

[frontend]
# 前端开发服务器端口
dev_port = 3000
# 后端API地址（前端调用）
api_base_url = http://localhost:8000


[container]
# 是否启用容器模式（启用后将通过HTTP调用容器API而非本地加载模型）
enabled = false
# OpenAI 兼容 API 地址（必须以 /v1 结尾）
# 例如 vLLM: http://localhost:8001/v1
api_url = http://localhost:8080/v1
# 模型名称（留空则使用 [model] 中的 model_name）
model_name = 
# 请求超时时间（秒，大模型推理可能需要较长时间）
timeout = 300
# 连接失败最大重试次数
max_retries = 3

# ============================================================
# Debug 调试开关
# 启用后会在终端输出对应模块的详细调试信息
# ============================================================

[debug]
# 总开关：关闭后忽略所有debug子开关
enabled = true

# 模型加载调试：显示模型加载进度、内存占用、设备信息
debug_model_loading = true

# 推理过程调试：显示推理耗时、token统计、生成速度
debug_inference = true

# API请求调试：显示请求/响应详情、参数校验
debug_api = true

# 内存监控调试：显示显存/内存占用变化
debug_memory = false

# 配置加载调试：显示配置文件解析过程
debug_config = true

# 前端调试：启用前端详细日志
debug_frontend = true

# ============================================================
# 平台特定配置
# 针对不同部署平台的特殊设置
# ============================================================

[platform]
# 当前平台标识: desktop / jetson_thor
current = jetson_thor

[platform.jetson_thor]
# Jetson Thor 专用配置
# 启用 DLA 加速（如果可用）
use_dla = false
# 功耗模式: MAXN / 15W / 30W
power_mode = MAXN
# 启用内存优化模式
memory_optimize = true

[platform.desktop]
# 桌面GPU专用配置
# 是否使用多GPU
multi_gpu = false
# GPU设备ID列表（逗号分隔）
gpu_devices = 0


[logging]
# 日志级别: DEBUG / INFO / WARNING / ERROR / CRITICAL
level = INFO
# 日志文件路径（留空表示仅输出到控制台）
file_path = 
# 日志格式
format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s
# 是否启用彩色输出
colorize = true
