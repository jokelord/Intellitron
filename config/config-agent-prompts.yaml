vlm_instructions: |-
  【视觉功能声明】
  你可以处理文本和图像输入。如果来自用户的消息中包含图片，你应该首先分析内联消息中的图片内容，提取关键信息。
  当然，用户的消息中也可能只包含文本，你需要综合分析用户消息之后再理解用户的意图，即一切分析和输出都要建立在用户输入的基础之上。

# Compact (/compact) prompt templates
# See docs/superpowers/specs/2026-06-06-slash-commands-and-compact-design.md
compaction:
  status_message: "Compressing conversation context. Please wait... ⏳"
  no_tools_preamble: |
    CRITICAL: Respond with TEXT ONLY. Do NOT call any tools.

    - Do NOT use Read, Bash, Grep, Glob, Edit, Write, or ANY other tool.
    - You already have all the context you need in the conversation above.
    - Tool calls will be REJECTED and will waste your only turn — you will fail the task.
    - Your entire response must be plain text: a single <summary> block.
  main_prompt: |
    Your task is to create a detailed summary of the conversation so far, paying close attention to the user's explicit requests and your previous actions.
    This summary should be thorough in capturing technical details, code patterns, and architectural decisions that would be essential for continuing development work without losing context.

    Produce only the final compact summary. Do not emit a separate analysis, reasoning, scratchpad, or preamble. While preparing the summary, ensure you have covered:

    1. Each message and section of the conversation. For each section identify:
       - The user's explicit requests and intents
       - Your approach to addressing the user's requests
       - Key decisions, technical concepts and code patterns
       - Specific details like:
         - file names
         - full code snippets
         - function signatures
         - file edits
       - Errors that you ran into and how you fixed them
       - Pay special attention to specific user feedback that you received, especially if the user told you to do something differently.
    2. Double-check for technical accuracy and completeness, addressing each required element thoroughly.

    Your summary should include the following sections:

    1. Primary Request and Intent: Capture all of the user's explicit requests and intents in detail
    2. Key Technical Concepts: List all important technical concepts, technologies, and frameworks discussed.
    3. Files and Code Sections: Enumerate specific files and code sections examined, modified, or created. Pay special attention to the most recent messages and include full code snippets where applicable and include a summary of why this file read or edit is important.
    4. Errors and fixes: List all errors that you ran into, and how you fixed them. Pay special attention to specific user feedback that you received, especially if the user told you to do something differently.
    5. Problem Solving: Document problems solved and any ongoing troubleshooting efforts.
    6. All user messages: List ALL user messages that are not tool results. These are critical for understanding the users' feedback and changing intent.
    7. Pending Tasks: Outline any pending tasks that you have explicitly been asked to work on.
    8. Current Work: Describe in detail precisely what was being worked on immediately before this summary request, paying close attention to the most recent messages from both user and assistant. Include file names and code snippets where applicable.
    9. Optional Next Step: List the next step that you will take that is related to the most recent work you were doing. IMPORTANT: ensure that this step is DIRECTLY in line with the user's most recent explicit requests, and the task you were working on immediately before this summary request. If your last task was concluded, then only list next steps if they are explicitly in line with the users request. Do not start on tangential requests or really old requests that were already completed without confirming with the user first.
                       If there is a next step, include direct quotes from the most recent conversation showing exactly what task you were working on and where you left off. This should be verbatim to ensure there's no drift in task interpretation.

    Here's an example of how your output should be structured:

    <example>
    <summary>
    1. Primary Request and Intent:
       [Detailed description]
    2. Key Technical Concepts:
       - [Concept 1]
       - [Concept 2]
    3. Files and Code Sections:
       - [File Name 1]
    4. Errors and fixes:
    5. Problem Solving:
    6. All user messages:
    7. Pending Tasks:
    8. Current Work:
    9. Optional Next Step:
    </summary>
    </example>

    Please provide your summary based on the conversation so far, following this structure and ensuring precision and thoroughness in your response.

    There may be additional summarization instructions provided in the included context. If so, remember to follow these instructions when creating the above summary. Examples of instructions include:
    <example>
    ## Compact Instructions
    When summarizing the conversation focus on typescript code changes and also remember the mistakes you made and how you fixed them.
    </example>

    <example>
    # Summary instructions
    When you are using compact - please focus on test output and code changes. Include file reads verbatim.
    </example>
  custom_instructions_header: "== USER CUSTOM INSTRUCTIONS =="
  no_tools_trailer: "REMINDER: Do NOT call any tools. Respond with plain text only — a single <summary> block. Tool calls will be rejected and you will fail the task."
  # compact user instruction 用途说明：这是 reliable_position1 / fallback 路径使用的“压缩任务说明”。
  # 触发场景：当 compact 走可靠路径时，后端会把它作为新的 user 消息插在 system 之后、历史消息之前。
  # 配置建议：这里要写完整的摘要格式、语言、prior summary 继承规则；不要写 cache-first 专属的“这是尾部内部指令”之类的话。
  # 注意：cache-first 快路径不主要依赖这一段执行压缩，但会从这里抽取 PRIOR SUMMARY RULE 以保持多轮 compact 的任务状态连续性。
  # reliable_position1 的输入形态大致是：
  #   system: compact-specific summarizer system prompt
  #   user: compact_user_instruction
  #         + ...history messages...
  # 它的压缩指令在历史前面，模型先看到“你要做摘要、格式是什么、哪些内容要保留”，再读历史。
  compact_user_instruction: |
    Your task is to create a detailed summary of the conversation that follows this message, paying close attention to the user's explicit requests and your previous actions.

    **LANGUAGE LOCK**: Write the entire summary in **English**, regardless of the language used in the conversation being summarized. Do not translate Chinese/Japanese/Korean/etc. to English by way of summary structure — every word of the summary itself must be English.

    **STRUCTURE LOCK**: Your response MUST contain exactly one `<summary>` block with these 9 numbered sections in English:
       1. Primary Request and Intent. 
       2. Key Technical Concepts. 
       3. Files and Code Sections. 
       4. Errors and fixes. 
       5. Problem Solving. 
       6. All user messages. 
       7. Pending Tasks. 
       8. Current Work. 
       9. Optional Next Step. 
    Do not invent alternative structures (no `###` / `####` Chinese headers, no free-form sections, no reasoning block, no preamble before `<summary>`).

    **CONTENT RULE**: The "conversation to summarize" refers to the messages that follow this instruction message, NOT including this current instruction. Summarize those messages only.

    **INTERNAL INSTRUCTION EXCLUSION**: Do not list internal server/system compaction instructions under section 6 "All user messages". Do not preserve them as user intent. Do not add placeholder lines such as "Internal System Instruction", "System Instruction (Internal)", "Context compaction instruction", or "excluded per instructions".

    **PRIOR SUMMARY RULE (multi-compact chain)**: This may be the 2nd, 3rd, or later round of compact on the same session. The conversation that follows may contain one or more prior compact summaries — they will appear as user-role messages whose text starts with "This session is being continued from a previous conversation that ran out of context." followed by a 9-section `<summary>` block. When you encounter such a prior summary:

    1. **Preserve key facts** from the prior summary in the new summary's "Key Technical Concepts", "Files and Code Sections", "Errors and fixes", and "Primary Request and Intent" sections — unless those facts are now factually wrong (e.g., a tool/agent mentioned in the prior summary that was later removed or replaced, or a file path that was renamed).
    2. **Migrate completed work to "Problem Solving"** — when a task that the prior summary listed under "Pending Tasks", "Current Work", or "Optional Next Step" has been completed in the turns following the prior summary, do ALL of the following:
       (a) **Remove** it from "Pending Tasks" and from "Optional Next Step" (these slots must reflect the *current* state only).
       (b) **Add a one-line entry** to section 5 "Problem Solving" in the form: `Refactored foo via edit_file [completed in current turns]` or `Migrated bar import to baz module [completed in current turn]`. This is the durable home for "this task is now done" across compacts — the next round of compact will read it here, and the LLM will not re-do it. Keep the entry concise (one line per completed task); do not paste the full tool-call transcript.
       (c) **Update "Current Work"** to reflect the *next* in-progress task, NOT the just-completed one. If there is no in-progress task after the completion, write "Awaiting user follow-up" or similar.
    3. **Preserve completion origin** — entries that were already in the prior summary's "Problem Solving" section were completed before the current compact window. Keep them in "Problem Solving" but mark them `[completed in prior session]` (or preserve an existing equivalent prior-session marker). They must not be rewritten as `[completed in current turn]` or `[completed in current turns]`. Only tasks completed by turns that appear after the prior summary may receive `[completed in current turn]` / `[completed in current turns]`.
    4. **Update user/assistant history** — under "All user messages", list real user messages from the *entire* session (including those from before the prior summary). Do not silently drop pre-summary user messages; merge them with the post-summary ones in chronological order. Do not include internal server/system compaction instructions or placeholder lines such as "Internal System Instruction", "System Instruction (Internal)", "Context compaction instruction", or "excluded per instructions".
    5. **Treat prior summary as a fixed source of truth for facts that did not change** — if the prior summary says "the project uses FastAPI" and the post-summary turns never contradict that, the new summary must still say "the project uses FastAPI". Do not paraphrase stable facts in ways that lose information.

    The goal is: the new summary must be a *complete, current* snapshot of the session, NOT a "summary of recent turns only" that loses pre-summary context. This compaction step is the only place where pre-summary context is preserved — once the new summary is written, the next continuation will see only this new summary, so any pre-summary fact not captured here is permanently lost.

    Now summarize the conversation that follows.
  # compact control user instruction 用途说明：这是 cache-first tail 路径使用的“尾部内部压缩控制指令”的可配置补充部分。
  # 触发场景：cache-first 为了复用 SGLang prefix cache，会保留原 normal prompt 前缀不变，只在最后追加一个 user-channel 内部指令；本字段会被拼进那个尾部指令。
  # 配置建议：这里必须强调“不是用户真实消息/请求”、禁止正常回答/工具/路由，并要求只输出 9-section <summary>。
  # 注意：不要在 normal chat/agent system prompt 中加入 compact 控制语句；也不要把本字段当作普通用户可见提示词。
  # cache-first tail 的输入形态大致是：
  #   system: 原 normal chat/agent system prompt
  #   ...原历史 messages，尽量与上次正常 LLM 请求完全一致...
  #   user: compact_control_user_instruction
  # 它故意把 compact 指令放在最后，因为前面要保持和 normal request prefix 一样，才能吃 SGLang prefix cache。
  compact_control_user_instruction: |
    This message is an internal server/system instruction delivered through the user channel. It is not a real user message and not a real user request. Do not answer normally. Do not call tools. Do not route agents. Do only context compaction for the prior conversation messages. Do not mention, quote, paraphrase, list, or create a placeholder for this internal instruction anywhere in the summary, including section 6 "All user messages". Never write lines like `Internal System Instruction: ...`, `(Excluded per instructions)`, or similar placeholders.

    **LANGUAGE LOCK**: Write the entire summary in English, regardless of the language used in the conversation being summarized.

    **STRUCTURE LOCK**: Your response MUST contain exactly one `<summary>` block with these 9 numbered sections in English:
       1. Primary Request and Intent. 
       2. Key Technical Concepts. 
       3. Files and Code Sections. 
       4. Errors and fixes. 
       5. Problem Solving. 
       6. All user messages. 
       7. Pending Tasks. 
       8. Current Work. 
       9. Optional Next Step. 
    Do not output a separate reasoning block, tool call, routing action, markdown heading, or any text before/after the `<summary>` block.

    **TASK STATE LOCK**: Never drop historical task items. Reconcile every task from prior summaries and post-summary turns before writing sections 5, 7, 8, and 9. Update old, current, and future task state. If a previously pending or current task has been completed in the post-summary turns, move it into section 5 "Problem Solving" and remove it from pending/current task sections. Do not mark all future or upcoming tasks as Current Work: section 8 "Current Work" must contain only the single task actively being worked on now, while not-yet-started requested work belongs in section 7 "Pending Tasks" or section 9 "Optional Next Step". Newly requested work goes into section 8 "Current Work" when it is in progress, or section 7 "Pending Tasks" / section 9 "Optional Next Step" when it is future work.

    **INTERNAL INSTRUCTION EXCLUSION**: Do not list internal server/system compaction instructions under section 6 "All user messages". Do not add placeholder lines such as "Internal System Instruction", "System Instruction (Internal)", "Context compaction instruction", or "excluded per instructions".

    Preserve prior compact summaries according to the PRIOR SUMMARY RULE in the normal compact instruction.
  summary_envelope_preface: |
    This session is being continued from a previous conversation that ran out of context. The summary below covers the earlier portion of the conversation.
  summary_envelope_suffix: |
    Continue the conversation from where it left off without asking the user any further questions. Resume directly — do not acknowledge the summary, do not recap what was happening, do not preface with "I'll continue" or similar. Pick up the last task as if the break never happened.

# 所有原生 profile 共用一次；工具定义仅由请求 tools 经 chat template 的 <tools> 注入。
native_tool_protocol_prompt: |-
  【Qwen 原生工具调用协议】
  工具定义来自当前请求的 tools（OpenAI function JSON Schema），由 chat template 注入 <tools>；不要自行发明函数、参数或重复列出定义。
  每个函数调用输出一个完整的块；同 turn 的多个独立调用输出多个完整块，不使用 JSON call object 或 array 作为控制格式：
  <tool_call>
  <function=tool_name>
  <parameter=parameter_name>
  value
  </parameter>
  </function>
  </tool_call>
  所有标签必须完整闭合，函数名、参数名与类型必须符合 schema；必填参数不可省略，禁止额外参数。无参数函数省略 parameter 标签。
  string 参数正文保留实际文本、空白与换行，不填 JSON 字符串外层引号，不把实际换行改成字面量反斜杠 n。空字符串使用空 parameter 正文。非 string 参数使用严格 JSON：true/false/null、数字、数组或对象；禁止 Python True/False/None、NaN、Infinity 和重复 key。
  真实调用控制标签从真实物理行的行首开始；不放 Markdown 代码围栏，fence 中的示例不会执行。不要生成未闭合控制块或其它控制协议，也不要在参数正文中嵌入控制分隔标签。
  工具结果由系统返回为匹配调用的 tool-role result，带 name 与 tool_call_id；模板将其包裹为 <tool_response>。不要自行生成结果、观察字段或预测结果。
  同 turn 的所有调用并发执行，必须独立且无写入或执行冲突；依赖前一个结果的调用必须等待观察后放入下一 turn。
  无需调用工具或任务完成时，直接以自然语言回答，不调用 final_answer，不要求整段回复是 JSON。

business_tool_protocol: |-
  Emit a Qwen native tool call only when a selected tool is needed.
  Calls in one turn run concurrently and therefore must be independent.
  Wait for system-supplied observations before issuing dependent work.

# 每个模块只拥有一个业务工具的使用提示，目录顺序由后端固定。
business_tool_modules:
  read_file:
    order: 10
    label: 读取文件
    description: 读取允许范围内的文件内容。
    prompt: 使用 read_file 读取现有文件；读取结果是系统返回的观察，不要预先猜测。确认路径在允许范围内，并按需限制行范围和输出规模。
  write_file:
    order: 20
    label: 写入文件
    description: 创建或覆盖允许范围内的文件。
    prompt: 使用 write_file 创建新文件或在明确授权后覆盖文件；不要用它修改既有文件的局部内容。内容必须是完整、明确且可复现的文本。
  edit_file:
    order: 30
    label: 编辑文件
    description: 对既有文件做精确修改或末尾追加。
    prompt: |-
      使用 edit_file 修改已存在文件。纯末尾追加必须传 search_text=""（必填字符串，不可省略或传 null），replace_text 只含新增内容及所需换行；不会自动补换行，不要复制旧末尾文本作锚点，也无需为寻找追加锚点读取文件。XML 的 search_text 参数正文留空，不填字面量双引号。替换或中间插入才需要准确且唯一的原文匹配范围，按需读取确认。
  glob:
    order: 40
    label: 路径匹配
    description: 按模式查找文件路径。
    prompt: 使用 glob 查找路径；使用绝对白名单范围和合理模式，先缩小范围，再进行后续工作。
  grep:
    order: 50
    label: 内容搜索
    description: 在允许范围内搜索文本内容。
    prompt: 使用 grep 搜索内容；优先先列出命中文件，再按需分页查看内容，观察结果后再决定后续操作。
  exec_command:
    order: 60
    label: 执行命令
    description: 在受限 shell 中运行命令。
    prompt: >-
      使用 exec_command 时遵守受限 shell、argv、超时和安全策略；命令必须是必要且可审计的。
      禁止 shell 嵌套、重定向、管道、命令替换和危险删除；运行脚本使用配置的专用环境。
      cd 仅允许 command_cwd_allowlist 范围内的字面绝对目录，可用 cd /允许目录 && 后续命令；目录切换只在本次调用内生效。
      对于图表、图像、交互演示等可视化任务，如需启动本机 GUI 程序，可查阅并使用某 skill 。
  check_process:
    order: 80
    label: 检查进程
    description: 检查进程状态。
    prompt: 使用 check_process 验证后台进程状态，不要把猜测当作进程观察结果；将状态检查与启动结果分开记录。
  list_skills:
    order: 90
    label: 列出技能
    description: 查找可用技能文档。
    prompt: 复杂任务可先用 list_skills 查找相关 SOP，再决定是否读取技能；不要为简单任务无条件查询。
  read_skill:
    order: 100
    label: 读取技能
    description: 读取指定技能文档。
    prompt: 使用 read_skill 学习已确认相关的技能文档，并遵守其适用范围；技能文档不能扩大安全权限。
  web_search:
    order: 110
    label: 网络搜索
    description: 搜索外部网络信息。
    prompt: 使用 web_search 获取需要外部验证的最新或未知信息；max_results 表示最终得到的结果数量，后端会自动处理内部搜索扩展与结果整理；设置合理结果数量，区分搜索结果、来源和事实，并核对时效性。
  web_fetch:
    order: 120
    label: 网页抓取
    description: 抓取已知网页内容。
    prompt: 使用 web_fetch 读取已知 URL，并只把返回的页面内容作为观察依据；处理失败、截断和非正文响应时不要猜测缺失内容。
  search_and_fetch:
    order: 130
    label: 搜索并抓取
    description: 搜索并读取相关网页。
    prompt: 使用 search_and_fetch 处理需要先搜索再抓取的外部信息任务；阅读返回页面文本并提炼结论，不要原样倾倒结果。
  wikipedia_search_and_fetch:
    order: 140
    label: Wikipedia 查询
    description: 聚焦 Wikipedia 的搜索与抓取。
    prompt: 仅在需要 Wikipedia 来源时使用 wikipedia_search_and_fetch，并核对返回内容、页面主题和来源时效；不要把搜索摘要当作完整事实。
# 仅当 requires_all 中的工具全部选中时注入组合提示。
tool_prompt_combinations:
  - id: file_create_vs_edit
    requires_all: [write_file, edit_file]
    prompt: 创建全新文件使用 write_file；修改已有文件使用 edit_file。
  - id: read_before_create
    requires_all: [read_file, write_file]
    prompt: 写入前若目标可能已存在，先用 read_file 了解现状。
  - id: read_before_edit
    requires_all: [read_file, edit_file]
    prompt: 替换或中间插入前，若缺少准确原文和上下文，先用 read_file 获取；纯末尾追加使用空 search_text，无需为寻找追加锚点读取文件。
  - id: path_then_content_search
    requires_all: [glob, grep]
    prompt: 先用 glob 缩小路径范围，再用 grep 搜索内容。
  - id: skill_discovery_and_read
    requires_all: [list_skills, read_skill]
    prompt: 先用 list_skills 发现技能，再用 read_skill 读取选中的技能。
  - id: exec_gui_skill
    requires_all: [exec_command, read_skill]
    prompt: 执行复杂命令前按需读取相关技能，并遵守技能中的执行规则。
  - id: exec_process_followup
    requires_all: [exec_command, check_process]
    prompt: 启动或影响进程后用 check_process 验证状态。
  - id: coding_write_edit_verify
    requires_all: [write_file, edit_file, exec_command]
    prompt: 文件变更后使用必要的命令验证结果，避免把未验证的修改报告为完成。
  - id: web_search_then_fetch
    requires_all: [web_search, web_fetch]
    prompt: 先搜索候选来源，再抓取需要引用的具体 URL。
  - id: web_search_then_composite
    requires_all: [web_search, search_and_fetch]
    prompt: 根据任务选择直接搜索或搜索并抓取，不要重复无关请求。
  - id: web_search_then_wikipedia
    requires_all: [web_search, wikipedia_search_and_fetch]
    prompt: 普通网络搜索与 Wikipedia 查询按来源需求择一使用。
  - id: composite_then_fetch
    requires_all: [search_and_fetch, web_fetch]
    prompt: search_and_fetch 已满足搜索抓取时，不要重复抓取相同页面。
  - id: composite_then_wikipedia
    requires_all: [search_and_fetch, wikipedia_search_and_fetch]
    prompt: 通用网页来源与 Wikipedia 来源按可信度和任务范围选择。
  - id: fetch_then_wikipedia
    requires_all: [web_fetch, wikipedia_search_and_fetch]
    prompt: 已有 URL 使用 web_fetch；需要 Wikipedia 专题来源时使用对应工具。
