
# 本地 Transformers 回滚配置。顶层 batch_size 按文档页分组，不是 VLM 生成批大小。
pipeline_name: PaddleOCR-VL-1.6

engine: transformers
device: gpu:0
engine_config:
  dtype: bfloat16
  device_type: gpu
  device_id: 0

# 完整 Pipeline 一轮处理的页面分组大小。
batch_size: 64

# 队列重叠输入加载、文档 CV/layout 和本地 VLM 阶段，主要优化多页吞吐。
use_queues: True

use_doc_preprocessor: True
use_layout_detection: True
use_chart_recognition: True
use_seal_recognition: False
use_ocr_for_image_block: True
format_block_content: True
merge_layout_blocks: True
markdown_ignore_labels:
  - number
  - header
  - header_image
  - footer
  - footer_image

# SubModules 是父 Pipeline 直接调用的独立模型组件。
SubModules:
  LayoutDetection:
    module_name: layout_detection
    model_name: PP-DocLayoutV3
    # ModelScope revision f8bd2e7f6bb8773617356c59592a9beea51a9a6f.
    model_dir: ~/.paddlex/official_models/PP-DocLayoutV3_safetensors
    engine: transformers
    engine_config:
      dtype: float32
      device_type: gpu
      device_id: 0
      attn_implementation: eager
    # 版面检测 batch 按页面计数。
    batch_size: 8
    threshold: 0.3
    layout_nms: True
    layout_unclip_ratio: [1.0, 1.0] 
    layout_merge_bboxes_mode: 
      0: "union" # abstract
      1: "union" # algorithm
      2: "union" # aside_text
      3: "large" # chart
      4: "union" # content
      5: "large" # display_formula
      6: "large" # doc_title
      7: "union" # figure_title
      8: "union" # footer
      9: "union" # footer
      10: "union" # footnote
      11: "union" # formula_number
      12: "union" # header
      13: "union" # header
      14: "union" # image
      15: "large" # inline_formula
      16: "union" # number
      17: "large" # paragraph_title
      18: "union" # reference
      19: "union" # reference_content
      20: "union" # seal
      21: "union" # table
      22: "union" # text
      23: "union" # text
      24: "union" # vision_footnote
  VLRecognition:
    module_name: vl_recognition
    model_name: PaddleOCR-VL-1.6-0.9B
    # ModelScope revision d911116c363676c602c4786ad0b9667b1aee055f.
    model_dir: ~/.paddlex/official_models/PaddleOCR-VL-1.6
    engine: transformers
    engine_config:
      dtype: bfloat16
      device_type: gpu
      device_id: 0
      attn_implementation: sdpa
      generation_config:
        do_sample: False
    # 本地 VLM batch；-1 由 PaddleX 本地后端解析，保持现有行为不变。
    batch_size: -1
    genai_config:
      backend: native

# SubPipelines 是包含自身处理流程的嵌套 Pipeline。
SubPipelines:
  DocPreprocessor:
    pipeline_name: doc_preprocessor
    # 文档预处理 batch 按页面计数。
    batch_size: 8
    use_doc_orientation_classify: True
    # PaddleX 3.6.1 only constructs UVDoc when this initialization flag is true.
    # Project-owned normal requests explicitly send useDocUnwarping: false.
    use_doc_unwarping: True
    SubModules:
      DocOrientationClassify:
        module_name: doc_text_orientation
        model_name: PP-LCNet_x1_0_doc_ori
        # ModelScope revision 04cd0dee25d2300e63442f6989e8984b1f3dae77.
        model_dir: ~/.paddlex/official_models/PP-LCNet_x1_0_doc_ori_safetensors
        engine: transformers
        engine_config:
          dtype: float32
          device_type: gpu
          device_id: 0
          attn_implementation: eager
        # 方向分类模型的页面 batch。
        batch_size: 8
      DocUnwarping:
        module_name: image_unwarping
        model_name: UVDoc
        # ModelScope revision 505cd57c9915ac2656bee70ae4204aa12201aa1f.
        model_dir: ~/.paddlex/official_models/UVDoc_safetensors
        engine: transformers
        engine_config:
          dtype: float32
          device_type: gpu
          device_id: 0
          attn_implementation: eager
        # UVDoc 未显式设置 batch，继续使用 PaddleX 本地默认值。

Serving:
  visualize: False
  return_urls: False
  extra:
    max_num_input_imgs: 32
