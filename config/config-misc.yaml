# ============================================================
# Agent 工具调用配置
# 启用后在 /v1/agent/chat 端点提供 Agent 对话能力
# ============================================================

agent:
  # 总开关
  enabled: true
  # Agent 模式: tool_calling (原生工具调用) | code (生成 Python 代码)
  agent_mode: tool_calling
  # 最大推理步数
  max_steps: 120
  # Session 过期时间（分钟），过期后自动清理
  session_ttl_minutes: 100
  # 工作目录, null 表示使用当前目录
  work_dir: /tmp/agent_workdir
  # PythonInterpreterTool 允许的额外 import 模块列表
  # 最后6个还没有加到默认列表里，后续会加上
  python_authorized_imports:
    - json
    - os
    - re
    - math
    - datetime
    - pathlib
    - shutil
    - glob
    - hashlib
    - base64
    - collections
    - itertools
    - functools
    - typing
    - sympy
    - matplotlib
    - numpy
    - scipy
    - pandas
    - openpyxl
  # 命令黑名单 - 命中以下任一正则的命令将被阻断
  command_blacklist:
    - pattern: "rm\\s+.*-[a-z]*r[a-z]*f[a-z]*\\s+/(?:\\s|$)"
      reason: "递归删除根目录"
    - pattern: "rm\\s+.*-[a-z]*f[a-z]*r[a-z]*\\s+/(?:\\s|$)"
      reason: "递归删除根目录"
    - pattern: "\\bsudo\\s+"
      reason: "提权命令"
    - pattern: "\\bmkfs\\b"
      reason: "格式化设备"
    - pattern: "\\bdd\\s+.*of=/dev/"
      reason: "直接写入设备"
    - pattern: ":\\(\\)\\s*\\{\\s*:\\s*\\|\\s*:\\s*&\\s*\\}\\s*;\\s*:"
      reason: "Fork Bomb"
    - pattern: "\\b(shutdown|reboot|poweroff|halt)\\b"
      reason: "系统关机/重启"
    - pattern: "\\bchmod\\s+[0-7]*7[0-7]*\\s+/(?:\\s|$)"
      reason: "根目录权限扩大"
    - pattern: "\\bcurl\\s+.*\\|\\s*(ba)?sh\\b"
      reason: "远程脚本执行"
    - pattern: "\\bwget\\s+.*\\|\\s*(ba)?sh\\b"
      reason: "远程脚本执行"
    - pattern: ">\\s*/dev/sd[a-z]"
      reason: "直接写入磁盘设备"
    - pattern: "\\bsystemctl\\s+(stop|disable|mask)\\s+"
      reason: "禁用系统服务"

# ============================================================
# MCP (Model Context Protocol) 配置
# 支持连接外部 MCP 服务器以扩展工具能力
# ============================================================

mcp:
  # MCP 服务器列表
  servers: []
  # 示例配置（取消注释启用）：
  # - name: "excel"
  #   command: "uvx"
  #   args: ["excel-mcp-server", "stdio"]
  #   env:
  #     EXCEL_FILES_PATH: "./excel_files"
  #     FASTMCP_PORT: "8017"
  #
  # 常用 Excel MCP Server:
  # 1. haris-musa/excel-mcp-server (Python, 3.5k stars) - 推荐
  #    https://github.com/haris-musa/excel-mcp-server
  #    安装: uvx excel-mcp-server stdio
  #    特点: 无需 Excel 安装，支持 Linux/Mac/Windows
  # 2. sbroenne/mcp-server-excel (C#/.NET, 活跃维护)
  #    https://github.com/sbroenne/mcp-server-excel
  #    特点: 使用 Excel COM API，需要 Windows + Excel
  # 3. sbraind/excel-mcp-server (TypeScript/ExcelJS)
  #    https://github.com/sbraind/excel-mcp-server
  #    特点: 34 个工具，跨平台

# ============================================================
# Web 搜索工具配置
# ============================================================

web_tools:
  # === Primary Engine Configuration ===
  # 搜索引擎提供商: duckduckgo （首选！）/ bing (不支持中文搜索) / sogou (not available) / 360(not available)
  search_engine: duckduckgo
  # === Connection Protocol (连接方式) ===
  # 连接协议: curl / requests
  # - curl: 使用子进程调用 curl 命令 (更好的反爬能力，DuckDuckGo必选项)
  # - requests: 使用 Python requests 库 (更快,无需启动进程，bing不能用requests)
  protocol: curl
  # === HTTP Method (请求方法) ===
  # 请求方法: GET / POST
  # - GET: 将查询参数附加到 URL (大多数搜索引擎适用)
  # - POST: 在请求体中发送查询 (DuckDuckGo 必须使用 POST, bing不能用POST)
  method: POST 

  # === Fallback Engine (备用引擎) ===
  # 当主引擎失败时使用的备用引擎
  fallback_engine: bing
  # 备用引擎的连接协议
  fallback_protocol: curl
  # 备用引擎的请求方法
  fallback_method: GET

  # === 代理服务器配置 ===
  # 代理服务器地址 (中国大陆地区用户访问DuckDuckGo搜索引擎则必选)
  # 格式: "http://127.0.0.1:10808"
  proxy: "http://127.0.0.1:10808"

  # === Wikipedia 搜索 ===
  # 是否启用 Wikipedia 搜索
  enable_wikipedia: true

# ============================================================
# Debug 调试开关
# 启用后会在终端输出对应模块的详细调试信息
# ============================================================

debug:
  # 总开关：关闭后忽略所有debug子开关
  enabled: true
  # 模型加载调试：显示模型加载进度、内存占用、设备信息
  debug_model_loading: true
  # 推理过程调试：显示推理耗时、token统计、生成速度
  debug_inference: true
  # API请求调试：显示请求/响应详情、参数校验
  debug_api: true
  # 内存监控调试：显示显存/内存占用变化
  debug_memory: false
  # 配置加载调试：显示配置文件解析过程
  debug_config: true
  # 前端调试：启用前端详细日志
  debug_frontend: true

# ============================================================
# 平台特定配置
# 针对不同部署平台的特殊设置
# ============================================================

platform:
  # 当前平台标识: desktop / jetson_thor
  current: desktop
  jetson_thor:
    # Jetson Thor 专用配置
    # 启用 DLA 加速（如果可用）
    use_dla: false
    # 功耗模式: MAXN / 15W / 30W
    power_mode: MAXN
    # 启用内存优化模式
    memory_optimize: true
  desktop:
    # 桌面GPU专用配置
    # 是否使用多GPU
    multi_gpu: false
    # GPU设备ID列表（逗号分隔）
    gpu_devices: 0

logging:
  # 日志级别: DEBUG / INFO / WARNING / ERROR / CRITICAL
  level: INFO
  # 日志文件路径（留空表示仅输出到控制台）
  file_path: null
  # 日志格式
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # 是否启用彩色输出
  colorize: true

# ============================================================
# Cycle 可编程序列配置
# 定义自动化执行的 LLM 对话序列（支持嵌套循环、定时等待、多摄像头拍照）
# ============================================================

cycle:
  # 总开关
  enabled: true
  # 最大嵌套深度
  max_depth: 5
  # 最大执行时间（秒）
  max_duration: 3600
  # 是否在聊天中显示拍照缩略图
  show_thumbnails: true
  # 默认序列模板（前端可编辑覆盖）
  default_sequence:
    - wait: 1
    - message: "你好，请描述你看到的画面"
      photo: [0]
    - cycle:
        count: 3
        steps:
          - wait: 8
          - message: "请继续观察并报告变化"
            photo: [0]
